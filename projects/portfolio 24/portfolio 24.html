<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 24</title>
    <link rel="stylesheet" href="../../main_style.css">
    <style>
        /* Styl pro hlavní obsah - nyní viditelný defaultně */
        .real-content {
            display: block; /* Změněno z none na block */
            padding: 2rem;
            max-width: 800px;
            margin: 0; /* Přidáno auto pro centrování obsahu */
        }
        
        .profile-img {
            display: block; /* Aby se obrázky řadily pod sebe bez mezer z řádkování */
            width: 100%;
            max-width: 900px;
            height: auto;
            border: 1px solid #333;
            margin-bottom: 2rem;
        }
        
        .bio-text {
            line-height: 1.3;
            color: #ccc;
        }
        
        .banner {
            max-width: 1500px;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="nav-placeholder" class="nav-column"></div>

    <main class="content-column">
        <div id="final-content" class="real-content">
            <img src="Matyas Kunstmüller - Portfolio-komprimovaný-1.webp" class="profile-img" alt="Matyas Kunstmüller - strana 1">
            
            </div>
    </main>

    <script src="../../nav.js"></script>
    <script>
        // Parametr '../' říká, že kořen webu je o jednu složku výš
        if (typeof createNav === 'function') {
            createNav('../../', 'projekty');
        }

        // --- SKRIPT PRO AUTOMATICKÉ PŘIDÁNÍ OBRÁZKŮ ---
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('final-content');
            const baseName = "Matyas Kunstmüller - Portfolio-komprimovaný-";
            
            // Začneme od čísla 2 a skončíme u 29 (protože 1 už tam je a chtěl jsi 28 dalších)
            for (let i = 2; i <= 28; i++) {
                const img = document.createElement('img');
                img.src = `${baseName}${i}.webp`; // Vytvoří název souboru s číslem
                img.className = 'profile-img';    // Přidá styl
                img.alt = `Matyas Kunstmüller - strana ${i}`; // Přidá popisek
                img.loading = "lazy";             // Optimalizace: načítá obrázky až když k nim doscrolluješ
                container.appendChild(img);       // Vloží obrázek na stránku
            }
        });
    </script>
</body>
</html>
