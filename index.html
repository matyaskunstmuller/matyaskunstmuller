<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matyas Kunstmüller - Portfolio</title>
    <link rel="stylesheet" href="main_style.css">
    <style>
        body {
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        #infinite-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            perspective: 1000px;
        }
        
        .canvas-item {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Výchozí velikost, JS ji přepíše */
            width: 400px;
            height: 300px; /* Placeholder výška, než se načte obsah */
            will-change: transform;
            display: flex; /* Flex pro centrování placeholderu */
            align-items: center;
            justify-content: center;
            box-shadow: none;
            border-radius: 2px;
            cursor: pointer;
        }

        /* Při najetí zvedneme vrstvu */
        .canvas-item:hover {
            z-index: 10000 !important;
        }

        .canvas-item img, 
        .canvas-item video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            /* Animace zvětšení */
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.3s;
            opacity: 0; /* Skryté při načítání */
            animation: fadeIn 0.5s forwards; /* Plynulé zobrazení po načtení */
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Efekt zvětšení pouze na obsah */
        .canvas-item:hover img, 
        .canvas-item:hover video {
            filter: brightness(1.1);
            transform: scale(1.1); 
        }

        .overlay-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
            pointer-events: none;
        }
        #nav-placeholder {
            position: relative;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>
    <div id="infinite-canvas"></div>
    <div class="overlay-vignette"></div>

    <script src="nav.js"></script>
    <script>
        if (typeof createNav === 'function') {
            createNav('', 'main');
        }
    </script>

    <script>
        // =================================================================
        // 1. DATOVÁ MAPA
        // =================================================================
        
        const bookMapping = {

            "ztohoven.webm": 6,

            // Spread 7 (Typotrip)
            "!!!POUŽÍVANÝ LOOP s typo 2_1.webm": 7,
            "Mockup jen fotky.webp": 7,
            "333 tripotyp.webp": 7,

            "DSC00069.webp": 7,

            // Spread 8 (Blokkada)
            "Blokkada - Matyas Kunstmüller (1).webp": 8,
            "medium2_spread4.webm": 8,
            "Blokkada8animationweight-ezgif.com-gif-to-webp-converter.webp": 8,

            // Spread 9 (Bez Filtru / Autorská)
            "Bez filtru_prezentační plakát1(barevný).jpg": 9,
            "bez filtru_fotodokumentace knížky-03.webp": 9,
            "bez filtru_fotodokumentace knížky-08.webp": 9,
            "bez filtru_fotodokumentace knížky-10.webp": 9,
            "Návrhová plocha 2.jpg": 9,
            "uaaa loda.jpg": 9,
            "DSC03806-2.jpg": 9,
            "ražba ve stanuplener.jpg": 9,
            "DSC03306.jpg": 9,

            // Spread 10 (City Smog)
            "showcase naživo.webm": 10,
            "zvukový clean mock up.webm": 10,
            "smog/Zelená 0.webm": 10, "smog/Zelená 1.webm": 10, "smog/Zelená 2.webm": 10, "smog/Zelená 3.webm": 10,
            "smog/otevřeno 0.webm": 10, "smog/otevřeno 1.webm": 10, "smog/otevřeno 2.webm": 10, "smog/otevřeno 3.webm": 10,
            "smog/závory 1.webm": 10, "smog/závory 2.webm": 10, "smog/závory 3.webm": 10,
            "smog/červená 0.webm": 10, "smog/červená 1.webm": 10, "smog/červená 2.webm": 10, "smog/červená 3.webm": 10,
            "smog/šipka 1.webm": 10, "smog/šipka 2.webm": 10, "smog/šipka 3.webm": 10,

            // Spread 11 (1.TXT)
            "1-txt-2_overlay 2.webm": 11,

            // Spread 12 (Skicák / Ostatní)
            "Bez dwdwdwd1.webp": 12,
            "wdaawda.webp": 12,
            "adwadadwwddw.webp": 12,
            "awdadw.webp": 12,
            "awdawdad.webp": 12,
            "awdawdadwadadw.webp": 12,
            "awdawdadwadadw.webp": 12,
            "awdawdadwadadw.webp": 12,
            "ddddd.webp": 12,
            "ddddddf.webp": 12,
            "dddddg.webp": 12,
            "dddddw.webp": 12
        };

        // --- 2. SEZNAM OSTATNÍCH SOUBORŮ ---
        const otherAssets = [
            { src: "o-mne/tak bojuj ne.png", url: "o-mne/omne.html" },
            { src: "o-mne/fotkys.webm", url: "o-mne/omne.html" },
            { src: "o-mne/a jak mam bojovat.png", url: "o-mne/omne.html" },
            { src: "projects/projekty/blokkada.webm", url: "projects/font/font.html" },
            { src: "projects/projekty/typotrip.webm", url: "projects/book/bookengine.html#spread=7" },
            { src: "projects/font/assets/fontlab variable osy.webp", url: "projects/font/font.html" },
            { src: "projects/font/assets/ohnuté rohy.webp", url: "projects/font/font.html" }
        ];

        // --- 3. SESTAVENÍ FINÁLNÍHO SEZNAMU ---
        let allItems = [];

        // Přidání Book Assets
        for (const [filename, spread] of Object.entries(bookMapping)) {
            let fullPath;
            if (filename.includes("/")) {
                fullPath = `projects/book/media/${filename}`;
            } else {
                fullPath = `projects/book/media/${filename}`;
            }
            
            allItems.push({
                src: fullPath.replace(/ /g, '%20'),
                url: `projects/book/bookengine.html#spread=${spread}`
            });
        }

        // Přidání Other Assets
        otherAssets.forEach(item => {
            allItems.push({
                src: item.src.replace(/ /g, '%20'),
                url: item.url
            });
        });

        // Zamíchání
        allItems.sort(() => 0.5 - Math.random());


        // --- 4. INFINITE CANVAS LOGIKA S LAZY LOADINGEM ---

        const canvas = document.getElementById('infinite-canvas');
        const WORLD_SIZE = 4000; 
        const ITEM_COUNT = allItems.length;

        let camX = 0, camY = 0;
        let targetCamX = 0, targetCamY = 0;
        const items = [];

        class CanvasItem {
            constructor(data, index) {
                this.data = data;
                this.isLoaded = false; // Stav načtení
                this.element = null;
                this.mediaElement = null; // Odkaz na img/video
                
                this.reset();
                
                // Vytvoříme pouze kontejner (div), obsah až při lazy loadu
                this.element = document.createElement('div');
                this.element.className = 'canvas-item';
                
                // Nastavíme velikost a Z-index hned, aby grid fungoval i bez obrázků
                this.element.style.zIndex = Math.floor(this.depth * 100);
                this.element.style.width = (380 * this.depth) + 'px';
                
                // CLICK EVENT
                this.element.addEventListener('click', (e) => {
                    if (hasMovedDrastically) return; 
                    window.location.href = this.data.url;
                });

                canvas.appendChild(this.element);
            }

            reset() {
                this.x = (Math.random() - 0.5) * WORLD_SIZE;
                this.y = (Math.random() - 0.5) * WORLD_SIZE;
                
                // Menší rozptyl velikosti (0.8 - 1.3)
                this.depth = 0.8 + Math.random() * 0.5; 
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.2 + Math.random() * 0.3;
                this.driftX = Math.cos(angle) * speed;
                this.driftY = Math.sin(angle) * speed;
            }

            // Metoda pro fyzické vytvoření obsahu
            loadContent() {
                if (this.isLoaded) return;
                this.isLoaded = true;

                const src = this.data.src;
                const isVideo = src.endsWith('.webm') || src.endsWith('.mp4');

                if (isVideo) {
                    this.mediaElement = document.createElement('video');
                    this.mediaElement.muted = true;
                    this.mediaElement.loop = true;
                    this.mediaElement.playsInline = true;
                    this.mediaElement.preload = "metadata"; // Načíst jen metadata pro začátek
                } else {
                    this.mediaElement = document.createElement('img');
                    this.mediaElement.loading = "lazy"; // Pomocný atribut
                    this.mediaElement.decoding = "async"; // Nebrzdí main thread
                }
                
                this.mediaElement.src = src;
                this.mediaElement.onerror = () => { 
                    this.element.style.display = 'none'; 
                };
                
                this.element.appendChild(this.mediaElement);
                
                // Odebereme fixní výšku placeholderu, jakmile se obsah načte
                this.mediaElement.onload = () => {
                    this.element.style.height = 'auto';
                };
                if (isVideo) {
                    this.mediaElement.onloadeddata = () => {
                        this.element.style.height = 'auto';
                        this.mediaElement.play().catch(()=>{}); // Autoplay po načtení
                    };
                }
            }

            update() {
                this.x += this.driftX;
                this.y += this.driftY;

                let renderX = this.x + (camX * this.depth);
                let renderY = this.y + (camY * this.depth);

                const limitX = (WORLD_SIZE * this.depth) / 2;
                const limitY = (WORLD_SIZE * this.depth) / 2;

                // Infinite Wrap
                if (renderX > limitX) this.x -= WORLD_SIZE;
                if (renderX < -limitX) this.x += WORLD_SIZE;
                if (renderY > limitY) this.y -= WORLD_SIZE;
                if (renderY < -limitY) this.y += WORLD_SIZE;

                // --- OPTIMALIZACE / LAZY LOAD LOGIKA ---
                
                // Zjistíme, zda je prvek na obrazovce (plus rezerva)
                const buffer = 300; // Pixely okolo obrazovky
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                
                // Přepočet souřadnic (protože translate v CSS je od středu prvku)
                // renderX/Y je střed prvku (0,0 je střed obrazovky v CSS, ale tady pro výpočet musíme převést)
                const screenCenterX = screenW / 2;
                const screenCenterY = screenH / 2;
                
                // Skutečná pozice na obrazovce v pixelech
                const posX = renderX + screenCenterX;
                const posY = renderY + screenCenterY;
                
                const isVisible = (
                    posX > -buffer && 
                    posX < screenW + buffer && 
                    posY > -buffer && 
                    posY < screenH + buffer
                );

                if (isVisible) {
                    // 1. Pokud není načteno, načteme
                    if (!this.isLoaded) {
                        this.loadContent();
                    }
                    // 2. Pokud je to video a je načtené, ujistíme se, že hraje
                    if (this.mediaElement && this.mediaElement.tagName === 'VIDEO') {
                        if (this.mediaElement.paused) this.mediaElement.play().catch(()=>{});
                    }
                } else {
                    // 3. Pokud je mimo obrazovku a je to video, pauzneme ho (šetří CPU)
                    if (this.isLoaded && this.mediaElement && this.mediaElement.tagName === 'VIDEO') {
                        if (!this.mediaElement.paused) this.mediaElement.pause();
                    }
                }

                this.element.style.transform = `translate3d(${renderX}px, ${renderY}px, 0)`;
            }
        }

        // --- Init ---
        function init() {
            allItems.forEach((itemData, index) => {
                items.push(new CanvasItem(itemData, index));
            });
            requestAnimationFrame(animate);
        }

        // --- Animace ---
        function animate() {
            camX += (targetCamX - camX) * 0.05;
            camY += (targetCamY - camY) * 0.05;
            items.forEach(item => item.update());
            requestAnimationFrame(animate);
        }

        // --- Interakce ---
        let isDragging = false;
        let startX, startY;
        let hasMovedDrastically = false;

        window.addEventListener('mousedown', startDrag);
        window.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        window.addEventListener('wheel', onWheel, {passive: true});

        function startDrag(e) {
            if (e.target.closest('a') || e.target.closest('button') || e.target.closest('#nav-placeholder')) return;
            isDragging = true;
            hasMovedDrastically = false;
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            document.body.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            
            const dx = x - startX;
            const dy = y - startY;
            
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMovedDrastically = true;
            }

            targetCamX += dx * 1.5; 
            targetCamY += dy * 1.5;
            
            startX = x;
            startY = y;
        }

        function endDrag() {
            isDragging = false;
            document.body.style.cursor = 'grab';
        }

        function onWheel(e) {
            targetCamX -= e.deltaX * 1.0;
            targetCamY -= e.deltaY * 1.0;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
