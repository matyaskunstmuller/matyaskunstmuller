<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matyas Kunstmüller - Portfolio</title>
    <link rel="stylesheet" href="main_style.css">
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden; /* Zabrání scrollování, pokud se obrázek vejde */
        }

        /* Zarovnání obsahu na střed */
        .content-column {
            display: flex !important;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
        }

        /* Styl pro hlavní obrázek */
        .hero-image {
            display: block;
           /* Aby nepřetekl na šířku (mobil) */
            max-height: 12vh;     /* Aby nepřetekl na výšku */
            width: auto;          /* Zachování poměru stran */
            height: auto;         /* Zachování poměru stran */
            object-fit: contain;  /* Zajistí, že se obrázek nedeformuje */
        }
        
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="content-column">
        <img src="epik shit.png" 
             class="hero-image" 
             alt="Mega epik interactive shit">
    </main>

    <script src="nav.js"></script>
    <script>
        if (typeof createNav === 'function') {
            createNav('', 'main');
        }
    </script>
</body>
</html>
