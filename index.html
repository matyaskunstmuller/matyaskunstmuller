<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matyas Kunstmüller</title>
    <link rel="stylesheet" href="main_style.css">
    <style>
        /* ========================
           SLIDESHOW — FULL HEIGHT
           ======================== */

        /* Clip inside content area */
        .content-column {
            overflow: hidden !important;
            position: relative;
        }

        .slideshow-stage {
            width: 100%;
            height: 100vh;
            position: relative;
            background-color: #000;
        }

        .slide-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Individual slide */
        .c-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .c-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .c-slide video,
        .c-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        /* Links — block so the full area is clickable */
        .c-slide a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        /* Arrows matching the nav */
        .slide-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 100px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .slide-arrow:hover {
            opacity: 1;
        }

        .slide-arrow:hover::after {
            border-color: #fff;
        }

        .slide-arrow::after {
            content: '';
            display: block;
            width: 16px;
            height: 16px;
            border-right: 2px solid #888;
            border-bottom: 2px solid #888;
            transition: border-color 0.2s;
        }

        .arrow-left {
            left: 10px;
        }

        .arrow-left::after {
            transform: rotate(135deg);
        }

        .arrow-right {
            right: 10px;
        }

        .arrow-right::after {
            transform: rotate(-45deg);
        }
    </style>
</head>

<body class="page-main">
    <div id="nav-placeholder"></div>

    <main class="content-column">
        <div class="slideshow-stage" id="slideshowStage">
            <div class="slide-arrow arrow-left" id="prevBtn"></div>
            <div class="slide-container" id="slideContainer">
                <!-- populated by JS -->
            </div>
            <div class="slide-arrow arrow-right" id="nextBtn"></div>
        </div>
    </main>

    <script src="nav.js"></script>
    <script>
        if (typeof createNav === 'function') createNav('', 'main');

        /* ==============================================
           DATA — projects in order
           ============================================== */

        const projects = [
            { src: "projects/projekty/přední desky.webp", type: "img", link: "projects/book/bookengine.html" },
            { src: "projects/projekty/prostreno.webp", type: "img", link: "projects/prostreno/prostreno.html" },
            { src: "projects/povalec/media/povalec_logo_bila.webm", type: "video", link: "projects/povalec/povalec.html" },
            { src: "projects/projekty/showcase animace panaček_1.webm", type: "video", link: "projects/bertik/bertik.html" },
            { src: "projects/projekty/bez filtru_fotodokumentace knížky-10.webp", type: "img", link: "projects/bez filtru/bez.filtru.html" },
            { src: "projects/projekty/blokkada.webm", type: "video", link: "projects/font/font.html" },
            { src: "projects/projekty/1-TXT.webm", type: "video", link: "projects/1.txt/1.txt.html" },
            { src: "projects/projekty/typotrip.webm", type: "video", link: "projects/book/bookengine.html#spread=7" },
            { src: "projects/projekty/Zelená 2.webm", type: "video", link: "projects/city smog super swag/city smog super swag.html" },
            { src: "projects/projekty/s3b.webm", type: "video", link: "projects/book/bookengine.html#spread=2" },
            { src: "projects/projekty/360.webm", type: "video", link: "projects/book/bookengine.html#spread=3" },
        ];

        /* Build DOM elements */
        const container = document.getElementById('slideContainer');
        const slides = [];

        projects.forEach((data, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'c-slide';
            if (index === 0) wrapper.classList.add('active');

            const a = document.createElement('a');
            a.href = data.link;

            if (data.type === 'video') {
                const v = document.createElement('video');
                v.src = data.src;
                v.autoplay = true;
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
                v.preload = "metadata";
                a.appendChild(v);
            } else {
                const img = document.createElement('img');
                img.src = data.src;
                img.loading = "lazy";
                a.appendChild(img);
            }

            wrapper.appendChild(a);
            container.appendChild(wrapper);
            slides.push(wrapper);
        });

        /* Slideshow Logic */
        let currentIndex = 0;
        let slideInterval;

        function showSlide(index) {
            slides[currentIndex].classList.remove('active');
            
            // Handle wrapping
            if (index >= slides.length) {
                currentIndex = 0;
            } else if (index < 0) {
                currentIndex = slides.length - 1;
            } else {
                currentIndex = index;
            }
            
            slides[currentIndex].classList.add('active');
        }

        function nextSlide() {
            showSlide(currentIndex + 1);
        }

        function prevSlide() {
            showSlide(currentIndex - 1);
        }

        function startSlideshow() {
            stopSlideshow();
            slideInterval = setInterval(nextSlide, 5000); // 5 seconds
        }

        function stopSlideshow() {
            clearInterval(slideInterval);
        }

        // Event Listeners for Arrows
        document.getElementById('nextBtn').addEventListener('click', () => {
            nextSlide();
            startSlideshow(); // Reset timer on manual navigation
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            prevSlide();
            startSlideshow(); // Reset timer on manual navigation
        });

        // Pause on hover
        const stage = document.getElementById('slideshowStage');
        stage.addEventListener('mouseenter', stopSlideshow);
        stage.addEventListener('mouseleave', startSlideshow);

        // Allow scroll wheel navigation (optional, based on previous behavior)
        stage.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) {
                nextSlide();
            } else {
                prevSlide();
            }
            startSlideshow(); // Reset timer
        }, { passive: false });

        // Start auto-play
        startSlideshow();
    </script>
</body>

</html>
